name: Release

# TWO tag shapes, because there are two things to release and they version
# independently on purpose (`minimumCliVersion` exists so the skill archives and
# the packages can move apart):
#
#   v<pkg>          e.g. v0.4.0      -> npm publish, with provenance
#   skills-v<man>   e.g. skills-v1.1.0 -> GitHub release with the skill archives
#
# They used to share one trigger, and the two jobs each demanded that the tag
# match a DIFFERENT number - `skills/manifest.json` in one, the package version
# in the other - with `npm` needing `release` first. No tag could satisfy both,
# so the workflow could never publish anything and 0.2.0 and 0.3.0 went to npm
# by hand, i.e. with no provenance attestation. Backlog 1810.
#
# `v*` cannot match `skills-v*`: the glob is anchored, and one starts with s.

on:
  push:
    tags: ["v*", "skills-v*"]
  workflow_dispatch:
    inputs:
      release_kind:
        description: Verify one release lane without publishing
        required: true
        type: choice
        options: [packages, skills]
      version:
        description: Stable semver without a prefix
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Manual runs are verification-only and intentionally receive no OIDC token,
  # npm secret, or write-capable GitHub token.
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Read canonical app contract source
        id: app_contract
        run: |
          commit=$(node -p "require('./contract/app-source.json').commit")
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "app contract ref must be a full commit SHA" >&2; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Check out pinned canonical app contract
        uses: actions/checkout@v4
        with:
          repository: HH-Studio/simple-site-builder
          ref: ${{ steps.app_contract.outputs.commit }}
          path: .canonical-app
      - name: Verify immutable app checkout
        run: test "$(git -C .canonical-app rev-parse HEAD)" = "${{ steps.app_contract.outputs.commit }}"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun scripts/sync-contract.ts --check-app-contract .canonical-app
      - name: Verify requested release version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          RELEASE_KIND: ${{ inputs.release_kind }}
        run: |
          set -euo pipefail
          [[ "$DISPATCH_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "requested version must be stable semver" >&2; exit 1; }
          if [[ "$RELEASE_KIND" = "skills" ]]; then
            expected=$(node -p "require('./skills/manifest.json').releaseVersion")
          else
            expected=$(node -p "require('./package.json').version")
            cli=$(node -p "require('./packages/cli/package.json').version")
            [[ "$expected" = "$cli" ]] || { echo "site-kit ($expected) and cli ($cli) must share a version" >&2; exit 1; }
            dep=$(node -p "require('./packages/cli/package.json').dependencies['@snabbsajt/site-kit']")
            [[ "$dep" = "^${expected}" || "$dep" = "$expected" ]] || { echo "cli depends on site-kit '$dep', expected ${expected}" >&2; exit 1; }
          fi
          [[ "$DISPATCH_VERSION" = "$expected" ]] || { echo "requested version ${DISPATCH_VERSION} does not match ${expected}" >&2; exit 1; }
      - name: Build skill archives
        if: ${{ inputs.release_kind == 'skills' }}
        run: bun run release:assets

  # The skill archives. Only ever runs for a skills-v tag.
  release:
    if: ${{ github.event_name == 'push' && startsWith(github.ref_name, 'skills-v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read canonical app contract source
        id: app_contract
        run: |
          commit=$(node -p "require('./contract/app-source.json').commit")
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "app contract ref must be a full commit SHA" >&2; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Check out pinned canonical app contract
        uses: actions/checkout@v4
        with:
          repository: HH-Studio/simple-site-builder
          ref: ${{ steps.app_contract.outputs.commit }}
          path: .canonical-app
      - name: Verify immutable app checkout
        run: test "$(git -C .canonical-app rev-parse HEAD)" = "${{ steps.app_contract.outputs.commit }}"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun scripts/sync-contract.ts --check-app-contract .canonical-app
      - name: Verify release tag matches the skill manifest
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./skills/manifest.json').releaseVersion")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "manifest releaseVersion must be stable semver" >&2; exit 1; }
          [[ "$GITHUB_REF_NAME" = "skills-v${version}" ]] || { echo "tag ${GITHUB_REF_NAME} does not match manifest skills-v${version}" >&2; exit 1; }
      - name: Build versioned skill archives from canonical folders
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./skills/manifest.json').releaseVersion")
          mkdir -p release-assets
          for skill in import-website build-snabbsajt-site review-site-package; do
            archive="snabbsajt-${skill}-${version}.zip"
            staging=$(mktemp -d)
            cp -R "skills/${skill}" "${staging}/${skill}"
            if [ "${skill}" = "import-website" ]; then
              mkdir -p "${staging}/${skill}/references"
              cp skills/shared/import-mapping-rules.md "${staging}/${skill}/references/import-mapping-rules.md"
            fi
            (cd "${staging}" && zip -qr "${GITHUB_WORKSPACE}/release-assets/${archive}" "${skill}")
            rm -rf "${staging}"
            (cd release-assets && sha256sum "${archive}" > "${archive}.sha256")
          done
          cp skills/manifest.json "release-assets/snabbsajt-skills-${version}.json"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true

  # Publishing from CI is what makes npm provenance possible at all: the
  # attestation is signed with the workflow's OIDC identity, so a package
  # published by hand from a laptop can never carry one. Ordered site-kit first
  # because @snabbsajt/cli's dependency range starts at the version being published.
  #
  # Authentication prefers npm trusted publishing (OIDC). NPM_TOKEN remains an
  # optional fallback and must be a granular write token with bypass 2FA. Skill
  # archives and GitHub releases are created only by an independent skills-v tag.
  #
  # No `needs: release` any more. The archives job only runs for a skills-v tag,
  # so waiting on it is what made a package tag publish nothing at all.
  npm:
    if: ${{ github.event_name == 'push' && !startsWith(github.ref_name, 'skills-v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for provenance
    steps:
      - uses: actions/checkout@v4
      - name: Read canonical app contract source
        id: app_contract
        run: |
          commit=$(node -p "require('./contract/app-source.json').commit")
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "app contract ref must be a full commit SHA" >&2; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Check out pinned canonical app contract
        uses: actions/checkout@v4
        with:
          repository: HH-Studio/simple-site-builder
          ref: ${{ steps.app_contract.outputs.commit }}
          path: .canonical-app
      - name: Verify immutable app checkout
        run: test "$(git -C .canonical-app rev-parse HEAD)" = "${{ steps.app_contract.outputs.commit }}"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      # v7 does not write an empty NODE_AUTH_TOKEN placeholder, which would
      # suppress npm's trusted-publishing OIDC exchange when no fallback token
      # is configured.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing requires npm >=11.5.1; pin the minimum known-good CLI
      # instead of depending on whichever npm happens to ship with Node 22.
      - run: npm install --global npm@11.5.1
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun scripts/sync-contract.ts --check-app-contract .canonical-app
      - name: Verify the tag matches both package versions
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          cli=$(node -p "require('./packages/cli/package.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "package version must be stable semver" >&2; exit 1; }
          [[ "$version" = "$cli" ]] || { echo "site-kit ($version) and cli ($cli) must share a version" >&2; exit 1; }
          [[ "$GITHUB_REF_NAME" = "v${version}" ]] || { echo "tag ${GITHUB_REF_NAME} does not match version ${version}" >&2; exit 1; }
          dep=$(node -p "require('./packages/cli/package.json').dependencies['@snabbsajt/site-kit']")
          [[ "$dep" = "^${version}" || "$dep" = "$version" ]] || { echo "cli depends on site-kit '$dep', expected ${version}" >&2; exit 1; }
      - name: Configure npm token fallback
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -n "$NPM_TOKEN" ]]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
      - name: Publish @snabbsajt/site-kit
        if: ${{ github.event_name == 'push' }}
        run: bun scripts/publish-package.ts .
      - name: Publish @snabbsajt/cli
        if: ${{ github.event_name == 'push' }}
        run: bun scripts/publish-package.ts ./packages/cli
      - name: Cryptographically verify published package attestations
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          verify_dir=$(mktemp -d)
          cd "$verify_dir"
          npm init --yes >/dev/null
          npm install --ignore-scripts --save-exact "@snabbsajt/site-kit@${version}" "@snabbsajt/cli@${version}"
          npm audit signatures
